      - name: Wgranie gotowego .exe jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: FocusIt-Windows
          path: dist/FocusIt.exe
          if-no-files-found: error

      - name: Publikacja FocusIt.exe w zakładce Releases
        if: startsWith(github.ref, 'refs/tags/v')
