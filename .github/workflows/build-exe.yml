          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/FocusIt.exe --clobber 2>$null; if ($LASTEXITCODE -ne 0) { gh release create ${{ github.ref_name }} dist/FocusIt.exe --title "FocusIt ${{ github.ref_name }}" --notes "Gotowy program FocusIt dla Windows - jeden plik FocusIt.exe, bez instalacji. Pobierz FocusIt.exe z sekcji Assets ponizej i uruchom (dla pelnego efektu: jako administrator). Przy pierwszym starcie wlaczona jest SYMULACJA - program tylko pokazuje plan zamykania procesow." }
